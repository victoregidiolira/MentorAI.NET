trigger:
- main

resources:
- repo: self

variables:
  azureServiceConnection: 'AzureConnection'
  acrName: 'acrmentorai556653'            
  webAppName: 'app-mentorai-556653'       
  
  imageRepository: 'mentorai-api'
  dockerfilePath: '$(Build.SourcesDirectory)/dockerfiles/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and Push
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push image
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(azureServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Web App
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Azure Web App Deploy'
      inputs:
        azureSubscription: $(azureServiceConnection)
        appName: $(webAppName)
        containers: '$(acrName).azurecr.io/$(imageRepository):$(tag)'